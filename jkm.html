<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
        }

        #vid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            /* KRİTİK SATIR */
            background: black;
        }
    </style>
</head>

<body>

    <video id="vid">
        <source src="0374.mp4" type="video/mp4">
    </video>

    <script>
        const v = document.getElementById("vid");
        v.addEventListener("click", () => {
            v.play();
        });
    </script>

</body>

</html>
